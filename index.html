<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>家庭公費管家 🌸</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --pink:      #E8829A;
    --pink-l:    #FFAAB8;
    --pink-pale: #FFE4EC;
    --pink-bg:   #FFF5F8;
    --mint:      #7DC9BE;
    --mint-l:    #B8E4D8;
    --mint-pale: #E4F7F4;
    --peach:     #FFD6A5;
    --lav:       #D4AAFF;
    --lav-pale:  #F0E8FF;
    --cream:     #FFF8F0;
    --text:      #3A2A3A;
    --soft:      #C0A0B4;
    --border:    3px solid #3A2A3A;
    --r:         20px;
    --inc:       #7DC9BE;
    --exp:       #E8829A;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Noto Sans TC', sans-serif;
    background: var(--pink-bg);
    min-height: 100vh;
    max-width: 430px;
    margin: 0 auto;
    padding-bottom: 100px;
    position: relative;
    overflow-x: hidden;
  }

  /* ── BACKGROUND BUBBLES ── */
  .bg-blob {
    position: fixed; border-radius: 50%;
    pointer-events: none; z-index: 0;
  }
  .blob1 { width:200px;height:200px;background:rgba(255,170,184,0.18);top:-60px;right:-60px; }
  .blob2 { width:160px;height:160px;background:rgba(184,228,216,0.22);bottom:80px;left:-50px; }
  .blob3 { width:120px;height:120px;background:rgba(212,170,255,0.18);top:45%;right:-30px; }
  .blob4 { width:90px;height:90px;background:rgba(255,214,165,0.25);top:30%;left:-20px; }

  /* ── CANVAS (falling petals) ── */
  #bgCanvas {
    position: fixed; top:0; left:50%; transform:translateX(-50%);
    width:430px; max-width:100vw; height:100vh;
    pointer-events:none; z-index:0;
  }

  /* z-index stack */
  .top-nav, .page, .bottom-tabs, .fab,
  .modal-overlay, .month-overlay, .toast { position: relative; z-index: 10; }

  /* ── TOP NAV ── */
  .top-nav {
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px 18px 12px;
    position: sticky; top: 0; z-index: 50;
    background: rgba(255,245,248,0.9);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }
  .nav-pill {
    font-family: 'Fredoka One', cursive;
    border: var(--border); border-radius: 50px;
    padding: 8px 16px; font-size: 0.9rem;
    background: white; cursor: pointer;
    display: flex; align-items: center; gap: 5px;
    box-shadow: 2px 2px 0 #3A2A3A;
    transition: all 0.15s; color: var(--text);
  }
  .nav-pill:active { transform: translate(2px,2px); box-shadow: 0 0 0 #3A2A3A; }
  .nav-month {
    font-family: 'Fredoka One', cursive;
    font-size: 1.3rem; color: var(--pink);
    display: flex; align-items: center; gap: 6px; cursor: pointer;
    text-shadow: 1px 1px 0 rgba(232,130,154,0.2);
  }

  /* ── PAGES ── */
  .page { display: none; }
  .page.active { display: block; }

  /* ── DONUT ── */
  .donut-wrap {
    display: flex; justify-content: center; align-items: center;
    padding: 16px 0 20px; position: relative;
  }
  .donut-svg {
    width: 220px; height: 220px; transform: rotate(-90deg);
    filter: drop-shadow(0 6px 20px rgba(232,130,154,0.22));
  }
  .donut-svg circle {
    transition: stroke-dasharray 0.8s cubic-bezier(0.4,0,0.2,1),
                stroke-dashoffset 0.8s cubic-bezier(0.4,0,0.2,1);
  }
  .donut-center { position: absolute; text-align: center; pointer-events: none; }
  .donut-label { font-size: 0.75rem; color: var(--soft); font-family: 'Noto Sans TC'; }
  .donut-amount {
    font-family: 'Fredoka One', cursive;
    font-size: 2rem; color: var(--pink); margin-top: 2px; line-height: 1;
  }
  .donut-sub { font-size: 0.68rem; color: var(--soft); margin-top: 3px; }

  /* ── SUMMARY ── */
  .summary-row { display: flex; gap: 12px; padding: 0 16px 22px; }
  .summary-pill {
    flex: 1; border: var(--border); border-radius: 18px;
    background: white; padding: 13px 14px;
    font-size: 0.78rem; color: var(--soft);
    box-shadow: 3px 3px 0 #3A2A3A;
    font-family: 'Noto Sans TC';
  }
  .summary-pill .val {
    font-family: 'Fredoka One', cursive;
    font-size: 1.2rem; margin-top: 4px;
  }
  .summary-pill .val.inc { color: var(--inc); }
  .summary-pill .val.exp { color: var(--exp); }

  /* ── SECTION TITLE ── */
  .section-title {
    font-family: 'Fredoka One', cursive;
    font-size: 1.05rem; color: var(--pink);
    display: flex; align-items: center; gap: 7px;
    padding: 0 16px 10px;
    letter-spacing: 0.3px;
  }

  /* ── CARD ── */
  .list-card {
    margin: 0 13px 22px;
    background: rgba(255,255,255,0.92);
    border: var(--border); border-radius: 22px;
    overflow: hidden;
    box-shadow: 4px 4px 0 #3A2A3A;
  }

  /* ── MEMBER ROW ── */
  .member-row {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 15px; border-bottom: 2px solid var(--pink-pale);
    cursor: pointer; transition: background 0.12s;
  }
  .member-row:last-child { border-bottom: none; }
  .member-row:active { background: var(--pink-pale); }
  .member-row.unpaid-row { opacity: 0.38; }

  .list-item {
    display: flex; align-items: center; gap: 12px;
    padding: 13px 15px; border-bottom: 2px solid var(--pink-pale);
  }
  .list-item:last-child { border-bottom: none; }

  .item-icon {
    width: 50px; height: 50px; border-radius: 15px;
    border: 2.5px solid #3A2A3A;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.45rem; flex-shrink: 0;
  }
  .item-icon.mint { background: var(--mint-pale); }
  .item-icon.pink { background: var(--pink-pale); }
  .item-icon.peach { background: #FFF3E0; }
  .item-icon.lav { background: var(--lav-pale); }
  .item-icon.plain { background: #F8F8F8; border-color: #CCC; }

  .item-info { flex: 1; min-width: 0; }
  .item-name {
    font-weight: 700; font-size: 0.95rem;
    font-family: 'Noto Sans TC';
  }
  .item-date { font-size: 0.75rem; color: var(--soft); margin-top: 2px; }

  .badge-unpaid {
    font-family: 'Fredoka One', cursive;
    font-size: 1rem; color: var(--soft);
  }
  .badge-paid {
    font-family: 'Fredoka One', cursive;
    font-size: 1rem; color: var(--inc);
  }
  .item-amount { font-family: 'Fredoka One', cursive; font-size: 1.1rem; white-space: nowrap; }
  .item-amount.inc { color: var(--inc); }
  .item-amount.exp { color: var(--exp); }
  .item-del { background: none; border: none; cursor: pointer; font-size: 0.9rem; opacity: 0.25; padding: 4px; }

  /* ── FAB ── */
  .fab {
    position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
    width: 64px; height: 64px; border-radius: 50%;
    border: var(--border); background: var(--pink-l);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Fredoka One'; font-size: 2.2rem;
    cursor: pointer; z-index: 50;
    box-shadow: 3px 3px 0 #3A2A3A; color: white;
    transition: all 0.15s;
  }
  .fab:active { transform: translateX(-50%) scale(0.93); box-shadow: 1px 1px 0 #3A2A3A; }

  /* ── BOTTOM TABS ── */
  .bottom-tabs {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 430px;
    display: flex; background: white; border-top: var(--border); z-index: 40;
  }
  .tab-item {
    flex: 1; display: flex; flex-direction: column; align-items: center;
    padding: 10px 0 14px; cursor: pointer;
    font-family: 'Fredoka One', cursive; font-size: 0.72rem;
    color: var(--soft); gap: 3px;
  }
  .tab-item .tab-icon { font-size: 1.4rem; }
  .tab-item.active { color: var(--pink); }

  /* ── MODAL ── */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(58,42,58,0.45);
    z-index: 100; display: none; align-items: flex-end; justify-content: center;
    backdrop-filter: blur(4px);
  }
  .modal-overlay.show { display: flex; }
  .modal-overlay.center { align-items: center; }

  .modal-sheet {
    background: var(--cream); width: 100%; max-width: 430px;
    border-radius: 28px 28px 0 0;
    border-top: var(--border); border-left: var(--border); border-right: var(--border);
    padding: 16px 18px 36px;
    animation: slideUp 0.28s ease; max-height: 92vh; overflow-y: auto;
  }
  .modal-sheet.center-sheet {
    border-radius: 26px; border: var(--border);
    width: 90%; max-width: 360px; padding: 26px 22px;
    box-shadow: 6px 6px 0 #3A2A3A;
  }
  @keyframes slideUp { from{transform:translateY(100%)} to{transform:translateY(0)} }
  .modal-handle { width: 44px; height: 5px; background: var(--pink-pale); border-radius: 3px; margin: 0 auto 18px; }

  /* ── PAY MODAL ── */
  .pay-emoji { font-size: 4rem; text-align: center; margin-bottom: 8px; display: block; }
  .pay-title {
    font-family: 'Fredoka One', cursive;
    font-size: 1.5rem; color: var(--text); text-align: center; margin-bottom: 4px;
  }
  .pay-sub { font-size: 0.85rem; color: var(--soft); text-align: center; margin-bottom: 20px; }
  .pay-amt-box {
    border: var(--border); border-radius: 18px; padding: 18px;
    background: var(--pink-pale); text-align: center; margin-bottom: 20px;
    box-shadow: 3px 3px 0 #3A2A3A;
  }
  .pay-amt-lbl { font-size: 0.75rem; color: var(--soft); margin-bottom: 8px; }
  .pay-amt-row { display: flex; align-items: center; justify-content: center; gap: 6px; }
  .pay-dollar { font-size: 1.3rem; color: var(--soft); font-family: 'Fredoka One'; }
  .pay-input {
    font-family: 'Fredoka One', cursive;
    font-size: 2.2rem; color: var(--pink);
    border: none; outline: none; background: transparent;
    text-align: center; width: 160px;
  }
  .pay-btn-row { display: flex; gap: 10px; }
  .pay-btn {
    flex: 1; padding: 14px; border-radius: 50px; border: var(--border);
    font-family: 'Fredoka One', cursive; font-size: 1rem;
    cursor: pointer; transition: all 0.15s; box-shadow: 3px 3px 0 #3A2A3A;
  }
  .pay-btn:active { transform: translate(2px,2px); box-shadow: 0 0 0 #3A2A3A; }
  .pay-btn.cancel { background: white; color: var(--soft); }
  .pay-btn.confirm { background: var(--mint-l); color: white; }
  .pay-btn.unpay { background: var(--pink-pale); color: var(--exp); margin-top: 10px; width: 100%; }

  /* ── ADD MODAL ── */
  .modal-toggle {
    display: flex; border: var(--border); border-radius: 50px;
    overflow: hidden; margin-bottom: 20px; box-shadow: 2px 2px 0 #3A2A3A;
  }
  .toggle-btn {
    flex: 1; padding: 11px; text-align: center;
    font-family: 'Fredoka One', cursive; font-size: 1rem;
    cursor: pointer; border: none; background: white; color: var(--soft);
    transition: background 0.2s;
  }
  .toggle-btn.active-exp { background: var(--pink-pale); color: var(--exp); }
  .toggle-btn.active-inc { background: var(--mint-pale); color: var(--inc); }

  .cat-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; margin-bottom: 20px; }
  .cat-item { display: flex; flex-direction: column; align-items: center; gap: 7px; cursor: pointer; }
  .cat-item-icon {
    width: 68px; height: 68px; border-radius: 20px; border: 2.5px solid #3A2A3A;
    display: flex; align-items: center; justify-content: center;
    font-size: 2rem; background: white; transition: all 0.15s;
    box-shadow: 2px 2px 0 #3A2A3A;
  }
  .cat-item.sel .cat-item-icon { background: var(--pink-pale); border-color: var(--pink); box-shadow: 2px 2px 0 var(--pink); }
  .cat-item-label { font-family: 'Fredoka One', cursive; font-size: 0.82rem; color: var(--text); }

  .amount-display {
    border-bottom: 3px solid var(--pink-l);
    display: flex; align-items: center; gap: 8px; padding: 10px 0; margin-bottom: 18px;
  }
  .amount-icon { font-size: 1.6rem; }
  .amount-note {
    flex: 1; border: none; outline: none; background: transparent;
    font-family: 'Noto Sans TC'; font-size: 0.88rem; color: var(--soft);
  }
  .amount-dollar { font-family: 'Fredoka One'; color: var(--soft); font-size: 1rem; }
  .amount-num { font-family: 'Fredoka One', cursive; font-size: 1.6rem; color: var(--text); }

  .numpad { display: grid; grid-template-columns: repeat(5,1fr); gap: 7px; }
  .num-btn {
    padding: 15px 4px; border-radius: 14px; border: 2px solid #E8D0DC;
    background: white; font-family: 'Fredoka One', cursive; font-size: 1.1rem;
    cursor: pointer; color: var(--text); transition: all 0.1s;
    box-shadow: 2px 2px 0 #E8D0DC;
  }
  .num-btn:active { background: var(--pink-pale); transform: translate(1px,1px); box-shadow: 1px 1px 0 #E8D0DC; }
  .num-btn.ac { background: #F8F0F4; font-size: 0.88rem; color: var(--soft); }
  .num-btn.ok { background: var(--pink); color: white; grid-row: span 2; border-color: var(--pink); box-shadow: 2px 2px 0 var(--pink); }
  .num-btn.ok:active { background: #D06070; }

  .field-label { font-family: 'Fredoka One', cursive; font-size: 0.88rem; color: var(--soft); margin-bottom: 7px; }
  .field-input {
    width: 100%; border: var(--border); border-radius: 14px;
    padding: 12px 14px; font-family: 'Noto Sans TC'; font-size: 0.95rem;
    outline: none; background: white; margin-bottom: 14px;
    box-shadow: 2px 2px 0 #3A2A3A;
  }
  .field-input:focus { border-color: var(--pink); }

  .action-btn {
    width: 100%; border: var(--border); border-radius: 50px;
    padding: 14px; font-family: 'Fredoka One', cursive; font-size: 1rem;
    cursor: pointer; margin-bottom: 10px;
    box-shadow: 3px 3px 0 #3A2A3A; transition: all 0.15s;
  }
  .action-btn:active { transform: translate(2px,2px); box-shadow: 0 0 0 #3A2A3A; }
  .btn-mint { background: var(--mint-l); color: white; }
  .btn-pink { background: var(--pink-l); color: white; }

  .share-box {
    border: var(--border); border-radius: 16px; padding: 14px 15px;
    background: white; font-size: 0.76rem; color: var(--soft);
    word-break: break-all; margin-bottom: 12px;
    font-family: monospace; box-shadow: 3px 3px 0 #3A2A3A;
  }

  /* ── STATS ── */
  .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 0 16px 22px; }
  .stat-box {
    border: var(--border); border-radius: 20px; background: white;
    padding: 16px; text-align: center; box-shadow: 3px 3px 0 #3A2A3A;
  }
  .stat-box .se { font-size: 1.9rem; margin-bottom: 6px; }
  .stat-box .sv { font-family: 'Fredoka One', cursive; font-size: 1.2rem; color: var(--pink); }
  .stat-box .sl { font-size: 0.72rem; color: var(--soft); margin-top: 3px; }

  /* ── MONTH PICKER ── */
  .month-overlay {
    position: fixed; inset: 0; background: rgba(58,42,58,0.4);
    z-index: 90; display: none; align-items: center; justify-content: center;
  }
  .month-overlay.show { display: flex; }
  .month-picker {
    background: var(--cream); border: var(--border); border-radius: 24px;
    padding: 22px; width: 82%; max-width: 300px; box-shadow: 6px 6px 0 #3A2A3A;
  }
  .month-picker h3 { font-family: 'Fredoka One', cursive; font-size: 1.1rem; color: var(--pink); margin-bottom: 14px; }
  .month-list { display: flex; flex-direction: column; gap: 8px; max-height: 280px; overflow-y: auto; }
  .month-opt {
    padding: 11px 15px; border-radius: 50px; border: 2px solid #E8D0DC;
    cursor: pointer; font-family: 'Fredoka One', cursive; font-size: 0.95rem;
    color: var(--text); background: white; transition: all 0.15s;
    box-shadow: 2px 2px 0 #E8D0DC;
  }
  .month-opt.act, .month-opt:hover { background: var(--pink-pale); border-color: var(--pink); color: var(--pink); }

  .row-input { display: flex; gap: 9px; margin-bottom: 12px; }
  .row-input .field-input { margin-bottom: 0; }
  .mem-del-btn {
    border: 2px solid #E8829A; border-radius: 50px;
    padding: 7px 14px; background: var(--pink-pale);
    font-family: 'Fredoka One', cursive; font-size: 0.82rem;
    color: var(--pink); cursor: pointer;
    transition: all 0.15s; white-space: nowrap;
  }
  .mem-del-btn:active { background: var(--pink-l); color: white; transform: scale(0.96); }
  .add-member-btn {
    border: var(--border); border-radius: 14px; padding: 12px 14px;
    background: var(--mint-pale); font-family: 'Fredoka One', cursive;
    cursor: pointer; white-space: nowrap; font-size: 0.9rem;
    box-shadow: 2px 2px 0 #3A2A3A; color: var(--text);
  }

  /* ── TOAST ── */
  .toast {
    position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--text); color: white; padding: 11px 24px; border-radius: 50px;
    font-family: 'Fredoka One', cursive; font-size: 0.95rem; z-index: 200;
    opacity: 0; transition: all 0.25s; white-space: nowrap; border: 2px solid #3A2A3A;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ── MONEY FLY ANIMATION ── */
  #moneyOverlay {
    position: fixed; inset: 0; z-index: 9999;
    pointer-events: none; overflow: hidden;
    display: none;
  }
  #moneyOverlay.show { display: block; }
  .money-item {
    position: absolute;
    pointer-events: none;
    will-change: transform, opacity;
  }

  .empty { text-align: center; padding: 32px 16px; color: var(--soft); }
  .empty .ee { font-size: 3.2rem; margin-bottom: 8px; display: block; }
  .empty p { font-family: 'Fredoka One', cursive; font-size: 0.9rem; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

</head>
<body>

<!-- Blob bg -->
<div class="bg-blob blob1"></div>
<div class="bg-blob blob2"></div>
<div class="bg-blob blob3"></div>
<div class="bg-blob blob4"></div>
<canvas id="bgCanvas"></canvas>

<!-- TOP NAV -->
<div class="top-nav">
  <button class="nav-pill" onclick="curMonth=new Date().toISOString().substr(0,7);refreshAll();">🏠 當月</button>
  <div class="nav-month" onclick="openMonthPicker()">
    <span id="navMonth">--</span> <span style="font-size:0.75rem;">▾</span>
  </div>
  <button class="nav-pill" onclick="switchPage('settings')">⚙️</button>
</div>

<!-- ══ HOME ══ -->
<div class="page active" id="page-home">
  <div class="donut-wrap">
    <svg class="donut-svg" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="37" fill="none" stroke="#F5E0E8" stroke-width="13"/>
      <circle cx="50" cy="50" r="37" fill="none" stroke="#FFAAB8" stroke-width="13"
        id="donutExp" stroke-dasharray="0 233" stroke-linecap="round"/>
      <circle cx="50" cy="50" r="37" fill="none" stroke="#B8E4D8" stroke-width="13"
        id="donutBal" stroke-dasharray="0 233" stroke-linecap="round"/>
    </svg>
    <div class="donut-center">
      <div class="donut-label">公費剩餘 💕</div>
      <div class="donut-amount" id="balDisp">$ 0</div>
      <div class="donut-sub" id="balSubDisp"></div>
    </div>
  </div>

  <div class="summary-row">
    <div class="summary-pill">本月收入 📈<div class="val inc" id="incDisp">$ 0</div></div>
    <div class="summary-pill">本月支出 📉<div class="val exp" id="expDisp">$ 0</div></div>
  </div>

  <div class="section-title">🌸 收入公費</div>
  <div class="list-card" id="memberPayList"></div>

  <div class="section-title" id="otherIncSection" style="display:none;">💰 其他收入</div>
  <div class="list-card" id="otherIncList" style="display:none;"></div>

  <div class="section-title">🛒 支出明細</div>
  <div class="list-card" id="expenseList"></div>
</div>

<!-- ══ STATS ══ -->
<div class="page" id="page-stats">
  <div style="padding:14px 16px 8px"><div class="section-title" style="padding:0">📊 本月統計</div></div>
  <div class="stats-grid" id="statsGrid"></div>
  <div class="section-title">🏷️ 支出分類</div>
  <div class="list-card" id="catBreak" style="margin-bottom:22px;"></div>
  <div class="section-title">👥 成員繳費進度</div>
  <div class="list-card" id="memStats" style="margin-bottom:22px;"></div>
</div>

<script>
// ━━━━━━━━━━━━━━━━━━━━━━━━━━
//  CUTE CANVAS BACKGROUND
// ━━━━━━━━━━━━━━━━━━━━━━━━━━
(function(){
  const cv=document.getElementById('bgCanvas');
  const ctx=cv.getContext('2d');
  const W=430, H=window.innerHeight;
  cv.width=W; cv.height=H;
  const rng=(a,b)=>Math.random()*(b-a)+a;

  // Falling petals
  const petals=Array.from({length:26},()=>({
    x:rng(0,W), y:rng(-H,H),
    size:rng(5,12), speed:rng(0.25,0.8),
    drift:rng(-0.25,0.25), angle:rng(0,Math.PI*2),
    spin:rng(-0.012,0.012),
    alpha:rng(0.12,0.32),
    color:['#FFAAB8','#FFD6E0','#B8E4D8','#D4AAFF','#FFD6A5'][Math.floor(rng(0,5))]
  }));

  // Static bubbles
  const bubbles=Array.from({length:14},()=>({
    x:rng(0,W), y:rng(0,H),
    r:rng(6,22), alpha:rng(0.04,0.12),
    color:['#FFAAB8','#B8E4D8','#D4AAFF'][Math.floor(rng(0,3))]
  }));

  function drawPetal(x,y,size,angle,alpha,color){
    ctx.save();
    ctx.globalAlpha=alpha;
    ctx.translate(x,y); ctx.rotate(angle);
    ctx.beginPath();
    ctx.ellipse(0,-size*0.55,size*0.35,size*0.65,0,0,Math.PI*2);
    ctx.fillStyle=color; ctx.fill();
    ctx.restore();
  }

  function frame(){
    ctx.clearRect(0,0,W,H);
    // Gradient bg
    const g=ctx.createLinearGradient(0,0,W,H);
    g.addColorStop(0,'#FFF5F8');
    g.addColorStop(0.5,'#FFF8F2');
    g.addColorStop(1,'#F5FFF8');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

    // Static bubbles
    bubbles.forEach(b=>{
      ctx.save(); ctx.globalAlpha=b.alpha;
      ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,Math.PI*2);
      ctx.fillStyle=b.color; ctx.fill(); ctx.restore();
    });

    // Petals
    petals.forEach(p=>{
      p.y+=p.speed; p.x+=p.drift; p.angle+=p.spin;
      if(p.y>H+20){p.y=-20;p.x=rng(0,W);}
      drawPetal(p.x,p.y,p.size,p.angle,p.alpha,p.color);
    });
    requestAnimationFrame(frame);
  }
  frame();
})();

// ━━━━━━━━━━━━━━━━━━━━━━━━━━
//  STORAGE
// ━━━━━━━━━━━━━━━━━━━━━━━━━━
// ━━━━━━━━━━━━━━━━━━━━━━━━━━
//  FIREBASE
// ━━━━━━━━━━━━━━━━━━━━━━━━━━
const firebaseConfig = {
  databaseURL: 'https://line-1fb38-default-rtdb.asia-southeast1.firebasedatabase.app'
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

function getRoomId(){
  let h=location.hash.replace('#','');
  if(!h){h='fam_'+Math.random().toString(36).substr(2,8);location.hash=h;}
  return h;
}
const ROOM=getRoomId();
const FB_REF = db.ref('rooms/' + ROOM);
const FB_EV_REF = db.ref('ev/' + ROOM);

// In-memory cache
let _cache = {members:[],entries:{},defaultAmt:1500};
let _evCache = [];
let _fbReady = false;

// Listen for real-time updates
FB_REF.on('value', snap => {
  _cache = snap.val() || {members:[],entries:{},defaultAmt:1500};
  _fbReady = true;
  if(document.readyState === 'complete' || document.readyState === 'interactive'){
    refreshAll();
  } else {
    document.addEventListener('DOMContentLoaded', refreshAll);
  }
}, err => {
  showToast('Firebase錯誤：' + err.code);
});
FB_EV_REF.on('value', snap => {
  _evCache = snap.val() || [];
  if(_fbReady){
    if(document.readyState === 'complete' || document.readyState === 'interactive'){
      refreshAll();
    }
  }
}, err => {
  showToast('EV錯誤：' + err.code);
});

function toArr(v){ if(!v) return []; if(Array.isArray(v)) return v; return Object.values(v); }
function getData(){
  const raw = _cache || {};
  const d = {
    members: toArr(raw.members),
    entries: {},
    defaultAmt: raw.defaultAmt || 1500
  };
  if(raw.entries){
    Object.keys(raw.entries).forEach(mo=>{
      d.entries[mo] = toArr(raw.entries[mo]);
    });
  }
  return d;
}
function save(d){ _cache = d; FB_REF.set(d); }
function getEvData(){ return Array.isArray(_evCache) ? _evCache : Object.values(_evCache||{}); }
function saveEvData(d){
  _evCache = d;
  FB_EV_REF.set(d);
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━
//  AVATARS
// ━━━━━━━━━━━━━━━━━━━━━━━━━━
const AVATARS=['🧑‍🌾','👨‍🍳','👩‍🎨','🧑‍💼','👴','👵','🧒','👦','👧','🕵️','🧑‍🚀','🧑‍🔬'];
function pickAv(){return AVATARS[Math.floor(Math.random()*AVATARS.length)];}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━
//  MONTH
// ━━━━━━━━━━━━━━━━━━━━━━━━━━
let curMonth=new Date().toISOString().substr(0,7);
function moLabel(m){const[y,mo]=m.split('-');return `${y}年 ${parseInt(mo)}月`;}
function updateNavMo(){document.getElementById('navMonth').textContent=moLabel(curMonth);}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━
//  PAY MODAL
// ━━━━━━━━━━━━━━━━━━━━━━━━━━
let payTarget=null;
function openPayModal(memberName){
  const d=getData();
  const m=d.members.find(x=>x.name===memberName)||{avatar:'👤'};
  const entries=d.entries[curMonth]||[];
  const existing=entries.find(e=>e.type==='income'&&e.member===memberName&&e.fixedPay);
  payTarget={memberName,avatar:m.avatar,entryId:existing?existing.id:null};
  document.getElementById('payEmoji').textContent=m.avatar;
  document.getElementById('payTitle').textContent=memberName;
  const mo=curMonth.split('-');
  document.getElementById('paySub').textContent=`${parseInt(mo[1])}月公費繳費 🌸`;
  document.getElementById('payAmtInput').value=existing?existing.amount:(d.defaultAmt||1500);
  const ub=document.getElementById('unpayBtn');
  const cb=document.getElementById('payConfirmBtn');
  if(existing){ub.style.display='block';cb.textContent='✏️ 修改金額';}
  else{ub.style.display='none';cb.textContent='✅ 確認繳費';}
  document.getElementById('payModal').classList.add('show');
}
function closePayModal(){document.getElementById('payModal').classList.remove('show');payTarget=null;}
function confirmPay(){
  if(evPayTarget){confirmEvPay();return;}
  if(!payTarget)return;
  const amt=parseFloat(document.getElementById('payAmtInput').value);
  if(!amt||amt<=0){showToast('請輸入正確金額 🥺');return;}
  // snapshot before closing modal (closePayModal sets payTarget=null)
  const memberName=payTarget.memberName;
  const avatar=payTarget.avatar;
  const entryId=payTarget.entryId;
  const d=getData();
  if(!d.entries[curMonth])d.entries[curMonth]=[];
  if(entryId)
    d.entries[curMonth]=d.entries[curMonth].filter(e=>e.id!==entryId);
  const now=new Date();
  const dateStr=String(now.getMonth()+1).padStart(2,'0')+'/'+String(now.getDate()).padStart(2,'0');
  d.entries[curMonth].push({
    id:Date.now(),type:'income',
    icon:avatar,amount:amt,
    member:memberName,
    note:'',date:dateStr,fixedPay:true
  });
  save(d);
  document.getElementById('payModal').classList.remove('show');
  payTarget=null;
  const bal1=calcBalance(getData(),curMonth);
  sendLineNotify(buildLineMsg('income',avatar,memberName,amt,bal1));
  showToast('🌸 '+memberName+' 繳費 $'+amt.toLocaleString()+' 入帳！');
  refreshAll();
}
function confirmUnpay(){
  if(evPayTarget){confirmEvUnpay();return;}
  if(!payTarget||!payTarget.entryId)return;
  const memberName=payTarget.memberName;
  const entryId=payTarget.entryId;
  showConfirm('取消 '+memberName+' 的繳費？','❌',()=>{
    document.getElementById('payModal').classList.remove('show');
    payTarget=null;
    const d=getData();
    const entry=d.entries[curMonth]&&d.entries[curMonth].find(e=>e.id===entryId);
    const amt=entry?entry.amount:0;
    d.entries[curMonth]=d.entries[curMonth].filter(e=>e.id!==entryId);
    save(d);
    const bal=calcBalance(getData(),curMonth);
    sendLineNotify(buildLineMsg('expense','🗑️','取消繳費：'+memberName,amt,bal));
    showToast('🗑️ 已取消 '+memberName+' 的繳費');
    refreshAll();
  });
}
document.getElementById('payModal').addEventListener('click',e=>{if(e.target.id==='payModal'){closePayModal();evPayTarget=null;}});

// ━━━━━━━━━━━━━━━━━━━━━━━━━━
//  EV PAY MODAL
// ━━━━━━━━━━━━━━━━━━━━━━━━━━
let evPayTarget=null;
function openEvPayModal(evId){
  const records=getEvData();
  const r=records.find(x=>x.id===evId);
  if(!r)return;
  const d=getData();
  const ents=d.entries[curMonth]||[];
  const existing=ents.find(e=>e.evRecordId===evId);
  evPayTarget={evId,record:r,entryId:existing?existing.id:null};
  document.getElementById('payEmoji').textContent='⚡';
  document.getElementById('payTitle').textContent=r.label;
  const mo=curMonth.split('-');
  document.getElementById('paySub').textContent=`${r.usage}度 × $${r.price} 電車電費`;
  document.getElementById('payAmtInput').value=r.amount;
  const ub=document.getElementById('unpayBtn');
  const cb=document.getElementById('payConfirmBtn');
  if(existing){ub.style.display='block';cb.textContent='✏️ 修改金額';}
  else{ub.style.display='none';cb.textContent='✅ 確認繳費';}
  payTarget=null;
  document.getElementById('payModal').classList.add('show');
}
function confirmEvPay(){
  if(!evPayTarget)return;
  const amt=parseFloat(document.getElementById('payAmtInput').value);
  if(!amt||amt<=0){showToast('請輸入正確金額 🥺');return;}
  const {evId,record,entryId}=evPayTarget;
  const targetMonth=record.monthVal||curMonth;
  const d=getData();
  if(!d.entries[targetMonth])d.entries[targetMonth]=[];
  if(entryId){
    // Remove from whichever month it was saved in
    Object.keys(d.entries).forEach(mo=>{
      d.entries[mo]=d.entries[mo].filter(e=>e.id!==entryId);
    });
  }
  const mo=targetMonth.split('-');
  const dateStr=mo[1]+'/01';
  d.entries[targetMonth].push({
    id:Date.now(),type:'income',icon:'⚡',amount:amt,
    member:'電車電費',note:record.label,date:dateStr,fixedPay:false,evRecordId:evId
  });
  save(d);
  document.getElementById('payModal').classList.remove('show');
  evPayTarget=null;
  const bal3=calcBalance(getData(),targetMonth);
  sendLineNotify(buildLineMsg('income','⚡',record.label,amt,bal3));
  showToast('⚡ 電車電費 $'+amt.toLocaleString()+' 已入帳！');
  refreshAll();
}
function confirmEvUnpay(){
  if(!evPayTarget||!evPayTarget.entryId)return;
  const {entryId}=evPayTarget;
  showConfirm('取消電車電費繳費？','❌',()=>{
    document.getElementById('payModal').classList.remove('show');
    evPayTarget=null;
    const d=getData();
    Object.keys(d.entries).forEach(mo=>{
      d.entries[mo]=d.entries[mo].filter(e=>e.id!==entryId);
    });
    save(d);
    showToast('🗑️ 已取消電車電費繳費');
    refreshAll();
  });
}


// ━━━━━━━━━━━━━━━━━━━━━━━━━━
//  MEMBERS
// ━━━━━━━━━━━━━━━━━━━━━━━━━━
function addMember(){
  const n=document.getElementById('newMem').value.trim();
  if(!n)return;
  const d=getData();
  if(d.members.find(m=>m.name===n)){showToast('成員已存在 👥');return;}
  d.members.push({name:n,avatar:pickAv()});
  save(d);document.getElementById('newMem').value='';
  refreshSettings();refreshAll();showToast(`✅ 新增成員 ${n}！`);
}
function remMem(name){
  showConfirm('確定移除 '+name+'？','🗑️',()=>{
    const d=getData();

// ━━━━━━━━━━━━━━━━━━━━━━━━━━
//  CATS + NUMPAD
// ━━━━━━━━━━━━━━━━━━━━━━━━━━
const CATS=[
  {name:'電費',icon:'⚡',bg:'#FFF9D6'},
  {name:'水費',icon:'💧',bg:'#D6F0FF'},
  {name:'網路費',icon:'🌐',bg:'#D6E8FF'},
  {name:'瓦斯費',icon:'🔥',bg:'#FFE8D6'},
  {name:'日用品',icon:'🧻',bg:'#F5F5F5'},
  {name:'其他',icon:'📦',bg:'#EEEEFF'},
];
let selCat=CATS[0],addMode='expense',numStr='0',numExpr='';

function renderCatGrid(){
  document.getElementById('catGrid').innerHTML=CATS.map(c=>
    `<div class="cat-item ${selCat.name===c.name?'sel':''}" onclick="selCatFn('${c.name}')">
      <div class="cat-item-icon" style="background:${c.bg}">${c.icon}</div>
      <div class="cat-item-label">${c.name}</div>
    </div>`
  ).join('');
}
function selCatFn(n){selCat=CATS.find(c=>c.name===n);document.getElementById('amIcon').textContent=selCat.icon;renderCatGrid();}
function setMode(m){
  addMode=m;const e=m==='expense';
  document.getElementById('tExp').className='toggle-btn '+(e?'active-exp':'');
  document.getElementById('tInc').className='toggle-btn '+(e?'':'active-inc');
  document.getElementById('catWrap').style.display=e?'block':'none';
  document.getElementById('memWrap').style.display=e?'none':'block';
  document.getElementById('amIcon').textContent=e?selCat.icon:'💰';
}
function np(k){
  if(k==='AC'){numStr='0';numExpr='';}
  else if(k==='⌫'){numStr=numStr.length>1?numStr.slice(0,-1):'0';}
  else if(['+','-','×','÷'].includes(k)){numExpr=numStr+k;numStr='0';}
  else if(k==='.'){if(!numStr.includes('.'))numStr+=k;}
  else{numStr=(numStr==='0'&&k!=='.')?k:numStr+k;}
  document.getElementById('amNum').textContent=numStr;
}
function getAmt(){
  const b=parseFloat(numStr)||0;
  if(numExpr){
    const a=parseFloat(numExpr)||0;
    if(numExpr.indexOf('+')!==-1)return a+b;
    if(numExpr.indexOf('-')!==-1)return a-b;
    if(numExpr.indexOf('×')!==-1)return a*b;
    if(numExpr.indexOf('÷')!==-1)return b!==0?a/b:0;
  }
  return b;
}
function submitExp(){
  const amount=getAmt();
  if(!amount||amount<=0){showToast('金額不能為 0 🥺');return;}
  const d=getData();
  if(!d.entries[curMonth])d.entries[curMonth]=[];
  const note=document.getElementById('amNote').value.trim();
  const now=new Date();
  const ds=`${String(now.getMonth()+1).padStart(2,'0')}/${String(now.getDate()).padStart(2,'0')}`;
  let lineIcon,lineName,lineType;
  if(addMode==='expense'){
    d.entries[curMonth].push({id:Date.now(),type:'expense',cat:selCat.name,icon:selCat.icon,amount,note,date:ds,member:'管理員'});
    lineIcon=selCat.icon; lineName=selCat.name+(note?'：'+note:''); lineType='expense';
  } else {
    const n=document.getElementById('otherIncNote').value.trim()||'其他收入';
    d.entries[curMonth].push({id:Date.now(),type:'income',icon:'💰',amount,note:n,date:ds,member:'其他',fixedPay:false});
    lineIcon='💰'; lineName=n; lineType='income';
  }
  save(d);
  const bal2=calcBalance(getData(),curMonth);
  sendLineNotify(buildLineMsg(lineType,lineIcon,lineName,amount,bal2));
  numStr='0';numExpr='';
  document.getElementById('amNum').textContent='0';
  document.getElementById('amNote').value='';
  document.getElementById('otherIncNote').value='';
  closeAdd();
  if(lineType==='expense') setTimeout(moneyFlyAnimation, 100);
  showToast('✅ 記帳成功！');refreshAll();
}
function delEntry(id){
  showConfirm('刪除這筆記錄？','🗑️',()=>{
    const d=getData();
    const entry=d.entries[curMonth]&&d.entries[curMonth].find(e=>e.id===id);
    if(d.entries[curMonth])d.entries[curMonth]=d.entries[curMonth].filter(e=>e.id!==id);
    save(d);
    if(entry){
      const bal=calcBalance(getData(),curMonth);
      const name=entry.type==='expense'?(entry.cat+(entry.note?'：'+entry.note:'')):(entry.note||'其他收入');
      sendLineNotify(buildLineMsg(entry.type,'🗑️','已刪除：'+name,entry.amount,bal));
    }
    refreshAll();
  });
}

//  RENDER HOME
// ━━━━━━━━━━━━━━━━━━━━━━━━━━
function getPrevMonthBal(d, month){
  // Sum all income and expense from months before 'month'
  const allMonths=Object.keys(d.entries).filter(m=>m<month).sort();
  let carry=0;
  allMonths.forEach(m=>{
    const ents=d.entries[m]||[];
    const inc=ents.filter(e=>e.type==='income').reduce((s,e)=>s+e.amount,0);
    const exp=ents.filter(e=>e.type==='expense').reduce((s,e)=>s+e.amount,0);
    carry+=inc-exp;
  });
  return carry;
}

function refreshHome(){
  const d=getData();
  const ents=d.entries[curMonth]||[];
  const incs=ents.filter(e=>e.type==='income');
  const exps=ents.filter(e=>e.type==='expense');
  const totInc=incs.reduce((s,e)=>s+e.amount,0);
  const totExp=exps.reduce((s,e)=>s+e.amount,0);
  const prevBal=getPrevMonthBal(d,curMonth);
  const bal=prevBal+totInc-totExp;

  const balEl=document.getElementById('balDisp');
  balEl.textContent='$ '+Math.abs(bal).toLocaleString();
  balEl.style.color=bal<0?'var(--exp)':'var(--pink)';
  document.getElementById('balSubDisp').textContent=bal<0?'⚠️ 已超支':prevBal!==0?`含前月結餘 $${prevBal.toLocaleString()}`:'';
  document.getElementById('incDisp').textContent='$ '+totInc.toLocaleString();
  document.getElementById('expDisp').textContent='$ '+totExp.toLocaleString();

  // Donut (animate)
  const circ=232.5;
  const donutExp=document.getElementById('donutExp');
  const donutBal=document.getElementById('donutBal');
  // Reset to 0 instantly (no transition)
  donutExp.style.transition='none';
  donutBal.style.transition='none';
  donutExp.setAttribute('stroke-dasharray',`0 ${circ}`);
  donutBal.setAttribute('stroke-dasharray',`0 ${circ}`);
  donutExp.setAttribute('stroke-dashoffset','0');
  donutBal.setAttribute('stroke-dashoffset','0');
  // Trigger animation on next frame
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      donutExp.style.transition='';
      donutBal.style.transition='';
      const totalBase=prevBal+totInc;
      if(totalBase<=0) return;
      const ep=Math.min(totExp/totalBase,1)*circ;
      const bp=Math.max((totalBase-totExp)/totalBase,0)*circ;
      donutExp.setAttribute('stroke-dasharray',`${ep} ${circ-ep}`);
      donutExp.setAttribute('stroke-dashoffset','0');
      donutBal.setAttribute('stroke-dasharray',`${bp} ${circ-bp}`);
      donutBal.setAttribute('stroke-dashoffset',`${-ep}`);
    });
  });

  // Member list + EV rows
  const mo=curMonth.split('-');
  const mLbl=`${parseInt(mo[1])}月公費`;
  const mEl=document.getElementById('memberPayList');
  // Show EV records for current month only
  const allEvRecs=getEvData();
  const allMonthEntries=Object.values(d.entries).flat();
  const evRecs=allEvRecs.filter(r=>r.monthVal===curMonth);
  const isEvPaid=(r)=>allMonthEntries.find(e=>e.evRecordId===r.id);
  const getEvPaidEntry=(r)=>allMonthEntries.find(e=>e.evRecordId===r.id);
  const memberRows=d.members.map(m=>{
    const paid=incs.find(e=>e.member===m.name&&e.fixedPay);
    const esc=m.name.replace(/'/g,"\'");
    return `<div class="member-row ${paid?'':'unpaid-row'}" onclick="openPayModal('${esc}')">
      <div class="item-icon plain">${m.avatar}</div>
      <div class="item-info" style="${paid?'':'opacity:0.5;'}">
        <div class="item-name">${m.name}</div>
        <div class="item-date">${paid?'已繳 ('+mLbl+')':'未繳 ('+mLbl+')'}</div>
      </div>
      ${paid?'<div class=\"badge-paid\">+'+paid.amount.toLocaleString()+'</div>':'<div class=\"badge-unpaid\">未繳</div>'}
    </div>`;
  });
  const evRows=evRecs.map(r=>{
    const paid=isEvPaid(r);
    return `<div class="member-row ${paid?'':'unpaid-row'}" onclick="openEvPayModal(${r.id})">
      <div class="item-icon plain">⚡</div>
      <div class="item-info" style="${paid?'':'opacity:0.5;'}">
        <div class="item-name">${r.label}</div>
        <div class="item-date">${paid?'已繳電車費':'未繳電車費'}</div>
      </div>
      ${paid?'<div class=\"badge-paid\">+'+r.amount.toLocaleString()+'</div>':'<div class=\"badge-unpaid\">未繳</div>'}
    </div>`;
  });
  const allRows=[...memberRows,...evRows];
  if(!allRows.length){
    mEl.innerHTML='<div class="empty"><span class="ee">👥</span><p>請先在設定中新增成員</p></div>';
  } else {
    mEl.innerHTML=allRows.join('');
  }
  // Other income list (fixedPay=false, not EV)
  const otherIncs=incs.filter(e=>!e.fixedPay&&!e.evRecordId);
  const oEl=document.getElementById('otherIncList');
  const oSec=document.getElementById('otherIncSection');
  if(otherIncs.length){
    oSec.style.display='flex';
    oEl.style.display='block';
    oEl.innerHTML=[...otherIncs].reverse().map((e)=>`
      <div class="list-item">
        <div class="item-icon mint">${e.icon}</div>
        <div class="item-info">
          <div class="item-name">${e.note||'其他收入'}</div>
          <div class="item-date">${e.date}</div>
        </div>
        <div class="item-amount inc">+${e.amount.toLocaleString()}</div>
        <button class="item-del" onclick="delEntry(${e.id})">✕</button>
      </div>`).join('');
  } else {
    oSec.style.display='none';
    oEl.style.display='none';
  }

  // Expense list
  const xEl=document.getElementById('expenseList');
  const iconCls=['pink','mint','lav','peach'];
  xEl.innerHTML=!exps.length
    ?'<div class="empty"><span class="ee">🧸</span><p>還沒有支出記錄</p></div>'
    :[...exps].reverse().map((e,i)=>`
      <div class="list-item">
        <div class="item-icon ${iconCls[i%4]}">${e.icon}</div>
        <div class="item-info">
          <div class="item-name">${e.cat}${e.note?' ：'+e.note:''}</div>
          <div class="item-date">${e.date}</div>
        </div>
        <div class="item-amount exp">-${e.amount.toLocaleString()}</div>
        <button class="item-del" onclick="delEntry(${e.id})">✕</button>
      </div>`).join('');
}

function refreshStats(){
  const d=getData();
  const ents=d.entries[curMonth]||[];
  const incs=ents.filter(e=>e.type==='income');
  const exps=ents.filter(e=>e.type==='expense');
  const totInc=incs.reduce((s,e)=>s+e.amount,0);
  const totExp=exps.reduce((s,e)=>s+e.amount,0);
  const bal=totInc-totExp;
  const paid=d.members.filter(m=>incs.find(e=>e.member===m.name&&e.fixedPay)).length;
  document.getElementById('statsGrid').innerHTML=`
    <div class="stat-box"><div class="se">💰</div><div class="sv">$${totInc.toLocaleString()}</div><div class="sl">本月收入</div></div>
    <div class="stat-box"><div class="se">💸</div><div class="sv">$${totExp.toLocaleString()}</div><div class="sl">本月支出</div></div>
    <div class="stat-box"><div class="se">🏦</div><div class="sv" style="color:${bal>=0?'var(--inc)':'var(--exp)'}">$${bal.toLocaleString()}</div><div class="sl">公費結餘</div></div>
    <div class="stat-box"><div class="se">✅</div><div class="sv">${paid}/${d.members.length}</div><div class="sl">已繳人數</div></div>`;

  const ct={};exps.forEach(e=>{ct[e.cat]=(ct[e.cat]||0)+e.amount;});
  const mx=Math.max(...Object.values(ct),1);
  const catBg={電費:'#FFF9D6',水費:'#D6F0FF',網路費:'#D6E8FF',瓦斯費:'#FFE8D6',日用品:'#F5F5F5',其他:'#EEEEFF'};
  document.getElementById('catBreak').innerHTML=!Object.keys(ct).length
    ?'<div class="empty"><span class="ee">📊</span><p>本月暫無支出</p></div>'
    :Object.entries(ct).sort((a,b)=>b[1]-a[1]).map(([cat,amt])=>{
      const c=CATS.find(x=>x.name===cat)||{icon:'📦'};
      return `<div class="list-item" style="flex-direction:column;align-items:stretch;gap:8px;">
        <div style="display:flex;align-items:center;gap:10px;">
          <div class="item-icon pink" style="width:44px;height:44px;border-radius:12px;font-size:1.3rem;background:${catBg[cat]||'#EEE'}">${c.icon}</div>
          <div style="flex:1;font-weight:700;font-size:0.9rem;">${cat}</div>
          <div style="font-family:'Fredoka One';color:var(--exp);">$${amt.toLocaleString()}</div>
        </div>
        <div style="background:var(--pink-pale);border-radius:20px;height:10px;overflow:hidden;">
          <div style="background:var(--pink-l);height:100%;width:${(amt/mx*100).toFixed(0)}%;border-radius:20px;transition:width 0.5s;"></div>
        </div>
      </div>`;
    }).join('');

  const mo=curMonth.split('-');
  const mLbl=`${parseInt(mo[1])}月公費`;
  document.getElementById('memStats').innerHTML=!d.members.length
    ?'<div class="empty"><span class="ee">👥</span><p>還沒有成員</p></div>'
    :d.members.map(m=>{
      const p=incs.find(e=>e.member===m.name&&e.fixedPay);
      return `<div class="list-item">
        <div class="item-icon plain">${m.avatar}</div>
        <div class="item-info"><div class="item-name">${m.name}</div><div class="item-date">${p?`已繳 ${mLbl}`:`未繳 ${mLbl}`}</div></div>
        ${p?`<div class="badge-paid">+${p.amount.toLocaleString()}</div>`:`<div class="badge-unpaid">未繳</div>`}
      </div>`;
    }).join('');
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━
function openMonthPicker(){
  const d=getData();
  const months=[...new Set(Object.keys(d.entries))].sort().reverse();
  const now=new Date().toISOString().substr(0,7);
  if(!months.includes(now))months.unshift(now);
  for(let i=-12;i<=3;i++){const dt=new Date();dt.setMonth(dt.getMonth()-i);const m=dt.toISOString().substr(0,7);if(!months.includes(m))months.push(m);}
  months.sort().reverse();
  document.getElementById('monthList').innerHTML=months.map(m=>{
    const ents=d.entries[m]||[];
    const totExp=ents.filter(e=>e.type==='expense').reduce((s,e)=>s+e.amount,0);
    const expTxt=totExp>0?`<span style="font-family:'Fredoka One';font-size:0.85rem;color:var(--exp);">-$${totExp.toLocaleString()}</span>`:'';
    return `<div class="month-opt ${m===curMonth?'act':''}" onclick="pickMo('${m}')" style="display:flex;justify-content:space-between;align-items:center;">${moLabel(m)}${expTxt}</div>`;
  }).join('');
  document.getElementById('monthOv').classList.add('show');
  // Scroll active month into view
  setTimeout(()=>{
    const act=document.querySelector('.month-opt.act');
    if(act) act.scrollIntoView({block:'center',behavior:'instant'});
  },0);
}
function closeMonthPicker(){document.getElementById('monthOv').classList.remove('show');}

function moneyFlyAnimation(){
  const overlay = document.getElementById('moneyOverlay');
  overlay.innerHTML = '';
  overlay.classList.add('show');

  const W = window.innerWidth;
  const H = window.innerHeight;

  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  canvas.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;';
  overlay.appendChild(canvas);

    y: WALLET_Y,
    rot: def.startRot,
    wingAngle: i * 1.5,
    opacity: 0,
    scale: 0.4,
    phase: 'wait',
    timer: 0,
  }));

  let globalTimer = 0;

  function drawSoftWing(side, wAngle) {
    const flap = Math.sin(wAngle) * 0.45;
    ctx.save();
    ctx.translate(side * BW * 0.44, -BH * 0.08);
    ctx.rotate(side * (0.08 + flap));
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(side * BW * 0.38, -BH * 0.88, side * BW * 0.92, -BH * 0.52);
    ctx.quadraticCurveTo(side * BW * 0.70, -BH * 0.12, side * BW * 0.46, 0);
    ctx.quadraticCurveTo(side * BW * 0.22, BH * 0.04, 0, 0);
    ctx.fillStyle = '#d2dde4'; ctx.fill();
    ctx.beginPath();
    ctx.moveTo(side * BW * 0.04, BH * 0.04);
    ctx.quadraticCurveTo(side * BW * 0.42, -BH * 0.28, side * BW * 0.80, -BH * 0.08);
    ctx.quadraticCurveTo(side * BW * 0.55, BH * 0.14, side * BW * 0.28, BH * 0.17);
    ctx.quadraticCurveTo(side * BW * 0.14, BH * 0.11, side * BW * 0.04, BH * 0.04);
    ctx.fillStyle = '#b8cdd6'; ctx.fill();
    ctx.beginPath();
    ctx.moveTo(side * BW * 0.07, BH * 0.16);
    ctx.quadraticCurveTo(side * BW * 0.38, BH * 0.44, side * BW * 0.66, BH * 0.28);
    ctx.quadraticCurveTo(side * BW * 0.46, BH * 0.44, side * BW * 0.23, BH * 0.41);
    ctx.quadraticCurveTo(side * BW * 0.14, BH * 0.30, side * BW * 0.07, BH * 0.16);
    ctx.fillStyle = '#d2dde4'; ctx.fill();
    ctx.restore();
  }

  function drawBill(b) {
    ctx.save();
    ctx.globalAlpha = Math.max(0, b.opacity);
    ctx.translate(b.x, b.y);
    ctx.rotate(b.rot);
    ctx.scale(b.scale, b.scale);
    drawSoftWing(-1, b.wingAngle);
    drawSoftWing( 1, b.wingAngle);
    const hw = BW / 2, hh = BH / 2;
    ctx.shadowColor = 'rgba(60,90,110,0.15)'; ctx.shadowBlur = 7; ctx.shadowOffsetY = 3;
    ctx.beginPath(); ctx.roundRect(-hw, -hh, BW, BH, 4);
    ctx.fillStyle = '#c6dce6'; ctx.fill();
    ctx.shadowColor = 'transparent';
    ctx.strokeStyle = '#7da8ba'; ctx.lineWidth = 1.1;
    ctx.beginPath(); ctx.roundRect(-hw, -hh, BW, BH, 4); ctx.stroke();
    ctx.strokeStyle = 'rgba(125,168,186,0.45)'; ctx.lineWidth = 0.8;
    ctx.beginPath(); ctx.roundRect(-hw+3, -hh+3, BW-6, BH-6, 2.5); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, BH * 0.33, 0, Math.PI * 2);
    ctx.fillStyle = '#e6f2f8'; ctx.fill();
    ctx.strokeStyle = '#7da8ba'; ctx.lineWidth = 0.9; ctx.stroke();
    ctx.fillStyle = '#2c4a58';
    ctx.font = 'bold ' + Math.round(BH * 0.44) + 'px Fredoka One, cursive';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('$', 0, BH * 0.02);
    ctx.restore();
  }

  let shakeAmt = 0;

  function animate() {
    ctx.clearRect(0, 0, W, H);
    globalTimer++;
    shakeAmt = globalTimer < 60 ? Math.sin(globalTimer * 0.9) * Math.max(0, 3 - globalTimer * 0.045) : 0;

    ctx.fillStyle = 'rgba(0,0,0,0.42)';
    ctx.fillRect(0, 0, W, H);

    const sx = shakeAmt;
    ctx.save();
    ctx.beginPath();
    ctx.arc(W/2 + sx, IMG_Y + IMG_SIZE/2, IMG_SIZE/2, 0, Math.PI*2);
    ctx.clip();
    if (kidImg.complete && kidImg.naturalWidth > 0) {
      ctx.drawImage(kidImg, IMG_X + sx, IMG_Y, IMG_SIZE, IMG_SIZE);
    } else {
      ctx.fillStyle = '#f5e8d0';
      ctx.fillRect(IMG_X + sx, IMG_Y, IMG_SIZE, IMG_SIZE);
      ctx.font = Math.round(IMG_SIZE * 0.45) + 'px serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('\uD83D\uDE2D', W/2 + sx, IMG_Y + IMG_SIZE/2);
    }
    ctx.restore();

    if (globalTimer < 100) {
      const tearAlpha = 0.6;
      [[-22, 0.44], [10, 0.46], [28, 0.43]].forEach(([ox, ry], ti) => {
        const ty = IMG_Y + IMG_SIZE * ry + ((globalTimer + ti*13) % 38) * 1.4;
        ctx.beginPath();
        ctx.ellipse(W/2 + ox + sx, ty, 2.2, 3.8, 0, 0, Math.PI*2);
        ctx.fillStyle = 'rgba(160,200,230,' + tearAlpha + ')'; ctx.fill();
      });
    }

    if (globalTimer < 80) {
      const hAlpha = Math.min(1, globalTimer/15) * Math.max(0, 1 - globalTimer/80);
      [[-IMG_SIZE*0.36, IMG_SIZE*0.18], [IMG_SIZE*0.34, IMG_SIZE*0.16]].forEach(([ox, oy], hi) => {
        const hs = 15 + Math.sin(globalTimer*0.09+hi)*2;
        ctx.save(); ctx.globalAlpha = hAlpha * 0.9;
        ctx.translate(W/2+ox, IMG_Y+oy);
        ctx.fillStyle = '#f05070';
        ctx.beginPath();
        ctx.moveTo(0, hs*0.4);
        ctx.bezierCurveTo(-hs,-hs*0.3,-hs*0.5,-hs,0,-hs*0.3);
        ctx.bezierCurveTo(hs*0.5,-hs,hs,-hs*0.3,0,hs*0.4);
        ctx.fill(); ctx.restore();
      });
    }

    let allDone = true;
    bills.forEach(b => {
      b.timer++;
      if (b.phase === 'wait' && globalTimer >= b.delay) b.phase = 'launch';
      if (b.phase === 'launch') {
        b.opacity = Math.min(1, b.opacity + 0.14);
        b.scale   = Math.min(1, b.scale + 0.07);
        b.vy -= 0.09;
        if (b.scale >= 1) b.phase = 'fly';
      } else if (b.phase === 'fly') {
        b.vy = Math.max(b.vy - 0.055, -4.8);
        b.vx += Math.sin(b.timer * b.drift) * 0.055;
        b.rot += b.rotSpeed;
        if (b.y < -BH * 2) b.phase = 'fade';
      } else if (b.phase === 'fade') {
        b.opacity -= 0.04;
        if (b.opacity <= 0) b.phase = 'done';
      }
      if (b.phase !== 'done' && b.phase !== 'wait') {
        b.x += b.vx; b.y += b.vy; b.wingAngle += 0.17;
        allDone = false; drawBill(b);
      } else if (b.phase === 'wait') { allDone = false; }
    });

    if (allDone || globalTimer > 340) {
      overlay.classList.remove('show'); overlay.innerHTML = '';
    } else { requestAnimationFrame(animate); }
  }
  setTimeout(() => requestAnimationFrame(animate), 80);
}

//  CUSTOM CONFIRM (replaces native confirm())
// ━━━━━━━━━━━━━━━━━━━━━━━━━━
function showConfirm(msg, emoji, onOk){
  document.getElementById('confirmMsg').textContent=msg;
  document.getElementById('confirmEmoji').textContent=emoji||'🤔';
  const modal=document.getElementById('confirmModal');
  modal.classList.add('show');
  const okBtn=document.getElementById('confirmOkBtn');
  const cancelBtn=document.getElementById('confirmCancelBtn');
  // Clone to remove old listeners
  const newOk=okBtn.cloneNode(true);
  const newCancel=cancelBtn.cloneNode(true);
  okBtn.parentNode.replaceChild(newOk,okBtn);
  cancelBtn.parentNode.replaceChild(newCancel,cancelBtn);
  newOk.addEventListener('click',()=>{modal.classList.remove('show');onOk();});
  newCancel.addEventListener('click',()=>{modal.classList.remove('show');});
}

function addEvRecord(){
  const y = document.getElementById('evYear').value;
  const m = document.getElementById('evMonthSel').value;
  const monthVal = y && m ? `${y}-${m}` : '';
  const cur = parseFloat(document.getElementById('evCurMeter').value);
  const price = parseFloat(document.getElementById('evPrice').value);
  if(!monthVal){ showToast('請選擇帳單年月 🥺'); return; }
  if(!cur || cur <= 0){ showToast('請輸入正確度數 🥺'); return; }
  if(!price || price <= 0){ showToast('請輸入正確單價 🥺'); return; }
  const records = getEvData();
  const label = `${y}年${parseInt(m)}月電車費`;
  // Find prev meter: last record sorted by date before this one
  const sorted = [...records].sort((a,b)=>a.id-b.id);
  const prev = sorted.length > 0 ? sorted[sorted.length-1].curMeter : 0;
  const usage = parseFloat((cur - prev).toFixed(1));
  if(usage < 0){ showToast('度數不能小於上次紀錄 🥺'); return; }
  const amount = Math.round(usage * price);
  records.push({ id: Date.now(), label, monthVal, prevMeter: prev, curMeter: cur, usage, price, amount });
  // Sort by monthVal
  records.sort((a,b)=>(a.monthVal||'').localeCompare(b.monthVal||''));
  saveEvData(records);
  document.getElementById('evCurMeter').value = '';
  document.getElementById('evPrice').value = '';
  refreshEv();
  refreshAll();
  showToast('✅ 已新增電費紀錄！');
}

function delEvRecord(id){
  showConfirm('刪除此筆電費紀錄？','⚡', ()=>{
    const records = getEvData().filter(r => r.id !== id);
    saveEvData(records);
    refreshEv();
    showToast('🗑️ 已刪除');
  });
}

let evChartInstance = null;
function initEvMonth(){
  const yearSel = document.getElementById('evYear');
  if(!yearSel) return;
  if(yearSel.options.length === 0){
    const now = new Date();
    const curY = now.getFullYear();
    for(let y = curY + 1; y >= curY - 3; y--){
      const opt = document.createElement('option');
      opt.value = y; opt.textContent = y + '年';
      yearSel.appendChild(opt);
    }
    yearSel.value = curY;
    const curM = now.getMonth()+1;
    const evenM = curM % 2 === 0 ? curM : curM + 1 > 12 ? 12 : curM + 1;
    document.getElementById('evMonthSel').value = String(evenM).padStart(2,'0');
  }
}
function refreshEv(){
  initEvMonth();
  const records = getEvData();
  const el = document.getElementById('evList');
  if(!records.length){
    el.innerHTML = '<div class="empty"><span class="ee">⚡</span><p>還沒有電費紀錄</p></div>';
  } else {
    el.innerHTML = [...records].reverse().map(r => `
      <div class="list-item" style="flex-direction:column;align-items:stretch;gap:4px;">
        <div style="display:flex;align-items:center;justify-content:space-between;">
          <div>
            <div style="font-weight:700;font-size:0.95rem;font-family:'Noto Sans TC';">${r.label}</div>
            <div style="font-size:0.75rem;color:var(--soft);margin-top:2px;">${r.prevMeter}▶${r.curMeter}度 （單價:$${r.price}）</div>
          </div>
          <div style="display:flex;align-items:center;gap:8px;">
            <div style="text-align:right;">
              <div style="font-size:0.75rem;color:var(--soft);">${r.usage} 度</div>
              <div style="font-family:'Fredoka One';font-size:1.2rem;color:#4BA8D4;">$ ${r.amount.toLocaleString()}</div>
            </div>
            <button class="item-del" onclick="delEvRecord(${r.id})">✕</button>
          </div>
        </div>
      </div>`).join('');
  }

  const canvas = document.getElementById('evChart');
  if(!canvas) return;
  if(evChartInstance){ evChartInstance.destroy(); evChartInstance = null; }
  if(records.length < 1){ canvas.style.display='none'; return; }
  canvas.style.display = 'block';
  const labels = records.map(r => r.label);
  const amounts = records.map(r => r.amount);
  const usages = records.map(r => r.usage);
  evChartInstance = new Chart(canvas, {
    data: {
      labels,
      datasets: [
        {
          type: 'bar', label: '度數', data: usages,
          backgroundColor: 'rgba(255,255,255,0.7)', borderColor: '#ccc', borderWidth: 1,
          yAxisID: 'y2', borderRadius: 6,
        },
        {
          type: 'line', label: '金額', data: amounts,
          borderColor: '#F5C842', backgroundColor: 'rgba(245,200,66,0.15)',
          borderWidth: 2.5, pointBackgroundColor: '#F5C842', pointRadius: 5,
          tension: 0.3, yAxisID: 'y1',
        }
      ]
    },
    options: {
      responsive: true,
      interaction: { mode: 'index', intersect: false },
      plugins: { legend: { position: 'top', labels: { font: { family: 'Noto Sans TC', size: 11 }, boxWidth: 24 } } },
      scales: {
        x: { ticks: { font: { size: 9 }, maxRotation: 30 }, grid: { display: false } },
        y1: { type: 'linear', position: 'left', ticks: { font: { size: 10 }, callback: v => '$'+v.toLocaleString() }, grid: { color: 'rgba(0,0,0,0.05)' } },
        y2: { type: 'linear', position: 'right', ticks: { font: { size: 10 }, callback: v => v+'度' }, grid: { display: false } }
      }
    }
  });
}

function calcBalance(d, month){
  const ents = d.entries[month]||[];
  const inc = ents.filter(e=>e.type==='income').reduce((s,e)=>s+e.amount,0);
  const exp = ents.filter(e=>e.type==='expense').reduce((s,e)=>s+e.amount,0);
  const prev = getPrevMonthBal(d, month);
  return prev + inc - exp;
}
